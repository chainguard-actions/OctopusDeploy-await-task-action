name: Test basic usage - invalid server graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_task_id: "ServerTasks-123"
          server: "https://octopus.example.invalid/"
          api_key: "API-FAKEKEY12345"
          space: "Default"
          polling_interval: "5"
          timeout_after: "30"
      - name: Assert action ran and failed gracefully (no real Octopus server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_STATE: ${{ steps.action.outputs.task_state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task_state: $TASK_STATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_STATE" ]; then
              echo "FAIL: action succeeded but task_state output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with task_state='$TASK_STATE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Octopus server reachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
