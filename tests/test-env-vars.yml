name: Test configuration via environment variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: "https://octopus.example.invalid/"
      OCTOPUS_API_KEY: "API-FAKEKEY12345"
      OCTOPUS_SPACE: "Default"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_task_id: "ServerTasks-321"
          polling_interval: "5"
          timeout_after: "30"
      - name: Assert action ran using env var configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_STATE: ${{ steps.action.outputs.task_state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task_state: $TASK_STATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TASK_STATE" ]; then
              echo "FAIL: action succeeded but task_state output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with task_state='$TASK_STATE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Octopus server reachable via env vars)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
