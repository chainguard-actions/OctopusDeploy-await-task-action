name: Test configuration via OCTOPUS_* env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        env:
          OCTOPUS_URL: http://127.0.0.1:1
          OCTOPUS_API_KEY: API-TESTKEYNOTREAL
          OCTOPUS_SPACE: Default
        with:
          server_task_id: ServerTasks-456
          polling_interval: '1'
          timeout_after: '5'
      - name: Assert action ran with env config and failed on unreachable server
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATE: ${{ steps.action.outputs.task_state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task_state: $STATE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (no Octopus server reachable)"
            exit 1
          fi
          if [ -n "$STATE" ]; then
            echo "FAIL: expected empty task_state"
            exit 1
          fi
          echo "PASS"
