name: Test environment variable configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          OCTOPUS_URL: https://octopus.example.invalid/
          OCTOPUS_API_KEY: API-FAKEAPIKEY12345
          OCTOPUS_SPACE: Default
        with:
          server_task_id: ServerTasks-22222
          polling_interval: '5'
          timeout_after: '15'

      - name: Assert action ran using env var configuration
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TASK_STATE: ${{ steps.action.outputs.task_state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task_state: $TASK_STATE"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (server unreachable via env vars)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
