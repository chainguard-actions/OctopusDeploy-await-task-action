name: Test missing server fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure Octopus env vars are not set
        run: |
          echo "OCTOPUS_URL=" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          server_task_id: ServerTasks-123
          api_key: API-TESTKEYNOTREAL
          space: Default
          polling_interval: '1'
          timeout_after: '5'
      - name: Assert action failed without server
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATE: ${{ steps.action.outputs.task_state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task_state: $STATE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server is missing"
            exit 1
          fi
          if [ -n "$STATE" ]; then
            echo "FAIL: expected empty task_state"
            exit 1
          fi
          echo "PASS"
