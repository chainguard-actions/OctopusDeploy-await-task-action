name: Test unreachable Octopus server fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          server_task_id: ServerTasks-123
          server: http://127.0.0.1:1
          api_key: API-TESTKEYNOTREAL
          space: Default
          polling_interval: '1'
          timeout_after: '5'
          hide_progress: 'true'
      - name: Assert action failed and produced no task state
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATE: ${{ steps.action.outputs.task_state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "task_state: $STATE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server is unreachable"
            exit 1
          fi
          if [ -n "$STATE" ]; then
            echo "FAIL: expected empty task_state"
            exit 1
          fi
          echo "PASS"
